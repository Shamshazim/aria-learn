name: CI

on:
  # Every pull request, not only those targeting main: a stacked PR (one ticket based on the
  # branch of the ticket it depends on) must be checked too, or the dependent work is unverified
  # until the day it retargets.
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real PostgreSQL, because the repository tests assert things only Postgres can settle:
    # that a cascade fires, that a partial unique index bites, that a CHECK becomes a 400.
    # Without it those suites would skip and the schema would go unchecked (P0-04).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aria
          POSTGRES_PASSWORD: aria
          POSTGRES_DB: aria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Each test file creates and drops its own database from this connection, so the role
      # needs CREATEDB — which the image's superuser already has.
      DATABASE_URL: postgresql://aria:aria@localhost:5432/aria_test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npm run format

      - name: Typecheck, lint and test
        run: npm run check

      - name: Install browser for visual baseline
        run: npx playwright install --with-deps chromium

      - name: Verify visual and accessibility baseline
        run: npm run e2e:baseline -w @aria/web

  # ── Images ─────────────────────────────────────────────────
  # Built on every pull request that could change one, and on main. Building is the check:
  # a Dockerfile that no longer builds is found here rather than during a deploy, which is
  # the moment it would otherwise be found (X-01).
  images:
    name: build container images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          load: true
          tags: aria-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          load: true
          tags: aria-web:ci
          build-args: |
            VITE_API_BASE_URL=https://api.ci.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `apps/voice-worker` arrives with the realtime harness. Until then there is nothing to
      # build, and a hard failure here would block every unrelated pull request.
      - name: Build the voice worker image, once it exists
        run: |
          if [ -d apps/voice-worker ]; then
            docker build -f infra/docker/voice-worker.Dockerfile -t aria-voice-worker:ci .
          else
            echo "apps/voice-worker is not in the tree yet (draft PR #18); skipping."
          fi

      # Each image must run as a non-root user, and must not carry a `.env`. Both are
      # acceptance criteria, and both are the kind of thing that silently regresses when
      # somebody edits a Dockerfile in a hurry.
      - name: Verify the images run unprivileged and carry no environment file
        run: |
          set -euo pipefail
          for image in aria-api:ci aria-web:ci; do
            user="$(docker run --rm --entrypoint sh "$image" -c 'id -u')"
            if [ "$user" = "0" ]; then
              echo "::error::$image runs as root"
              exit 1
            fi
            if docker run --rm --entrypoint sh "$image" -c 'ls -a / /app 2>/dev/null | grep -qx "\.env"'; then
              echo "::error::$image contains a .env file"
              exit 1
            fi
            echo "$image: uid $user, no .env"
          done

      - name: Verify the API image can run a migration plan
        run: |
          docker run --rm -e DATABASE_URL=postgresql://unused@127.0.0.1:1/none \
            aria-api:ci node --import tsx src/scripts/migrate.ts --help
