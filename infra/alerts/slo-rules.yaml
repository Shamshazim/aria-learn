# Generated by `npm run slo:rules -w @aria/api`. Do not edit by hand.
#
# One group per severity, generated from apps/api/src/observability/slo/slos.ts, which is
# generated from nothing: it is the hand-written list of the bars in master-plan.md §11.
# Change a number there and regenerate; a threshold edited here is a threshold that
# disagrees with the plan and with /status.
#
# 3 of 7 bars are watched here.
# Not watched, and why:
#   - audible_welcome: The clock starts in the browser, at the moment audio is unlocked, and stops at the first sample out of the speaker.
#   - interrupt_silence: Measured from the child speaking to the speaker going quiet, which again only the client observes.
#   - end_of_turn: This is a measurement against a labelled test set (P2-12 / P2H-13), not a property of live traffic: in production nothing knows whether a turn ended where the child meant it to.
#   - approach_changes_after_wrong: P1-14 computes this after the fact from `session_event` (`approachChangeViolations`), which needs the previous turn to compare against — so it is a stateful comparison rather than a counter a turn can emit on its own.

groups:
  - name: aria-slo-page
    rules:
      - alert: ContentWaitBudgetBurnFast1h
        expr: '(1 - (sum(rate(turn_content_ms_bucket{le="1000"}[1h])) / sum(rate(turn_content_ms_count[1h]))) > 0.720) and (1 - (sum(rate(turn_content_ms_bucket{le="1000"}[5m])) / sum(rate(turn_content_ms_count[5m]))) > 0.720)'
        for: 2m
        labels:
          severity: page
          slo: content_wait
        annotations:
          summary: 'A child waits for content is missing its bar (14.4x budget burn)'
          bar: 'Child waits for content — < 1s at the 95th percentile'
          runbook: 'infra/alerts/runbooks/content_wait.md'
      - alert: ContentWaitBudgetBurnFast6h
        expr: '(1 - (sum(rate(turn_content_ms_bucket{le="1000"}[6h])) / sum(rate(turn_content_ms_count[6h]))) > 0.300) and (1 - (sum(rate(turn_content_ms_bucket{le="1000"}[30m])) / sum(rate(turn_content_ms_count[30m]))) > 0.300)'
        for: 2m
        labels:
          severity: page
          slo: content_wait
        annotations:
          summary: 'A child waits for content is missing its bar (6x budget burn)'
          bar: 'Child waits for content — < 1s at the 95th percentile'
          runbook: 'infra/alerts/runbooks/content_wait.md'
      - alert: VisibleWelcomeBudgetBurnFast1h
        expr: '(1 - (sum(rate(arrival_ms_bucket{le="500"}[1h])) / sum(rate(arrival_ms_count[1h]))) > 0.720) and (1 - (sum(rate(arrival_ms_bucket{le="500"}[5m])) / sum(rate(arrival_ms_count[5m]))) > 0.720)'
        for: 2m
        labels:
          severity: page
          slo: visible_welcome
        annotations:
          summary: 'The welcome appears is missing its bar (14.4x budget burn)'
          bar: 'Visible personalised welcome after arrival — < 500ms at the 95th percentile'
          runbook: 'infra/alerts/runbooks/visible_welcome.md'
      - alert: VisibleWelcomeBudgetBurnFast6h
        expr: '(1 - (sum(rate(arrival_ms_bucket{le="500"}[6h])) / sum(rate(arrival_ms_count[6h]))) > 0.300) and (1 - (sum(rate(arrival_ms_bucket{le="500"}[30m])) / sum(rate(arrival_ms_count[30m]))) > 0.300)'
        for: 2m
        labels:
          severity: page
          slo: visible_welcome
        annotations:
          summary: 'The welcome appears is missing its bar (6x budget burn)'
          bar: 'Visible personalised welcome after arrival — < 500ms at the 95th percentile'
          runbook: 'infra/alerts/runbooks/visible_welcome.md'
      - alert: StaticFallbackReachesAChildBudgetBurnFast1h
        expr: '(sum(rate(fallback_used_total[1h])) / sum(rate(turns_total[1h])) > 0.144) and (sum(rate(fallback_used_total[5m])) / sum(rate(turns_total[5m])) > 0.144)'
        for: 2m
        labels:
          severity: page
          slo: static_fallback_reaches_a_child
        annotations:
          summary: 'A child gets canned text instead of teaching is missing its bar (14.4x budget burn)'
          bar: 'P2H-11: no static fallback reaches a child in a nominal session'
          runbook: 'infra/alerts/runbooks/static_fallback_reaches_a_child.md'
      - alert: StaticFallbackReachesAChildBudgetBurnFast6h
        expr: '(sum(rate(fallback_used_total[6h])) / sum(rate(turns_total[6h])) > 0.0600) and (sum(rate(fallback_used_total[30m])) / sum(rate(turns_total[30m])) > 0.0600)'
        for: 2m
        labels:
          severity: page
          slo: static_fallback_reaches_a_child
        annotations:
          summary: 'A child gets canned text instead of teaching is missing its bar (6x budget burn)'
          bar: 'P2H-11: no static fallback reaches a child in a nominal session'
          runbook: 'infra/alerts/runbooks/static_fallback_reaches_a_child.md'
  - name: aria-slo-ticket
    rules:
      - alert: ContentWaitBudgetBurnSlow1d
        expr: '(1 - (sum(rate(turn_content_ms_bucket{le="1000"}[1d])) / sum(rate(turn_content_ms_count[1d]))) > 0.150) and (1 - (sum(rate(turn_content_ms_bucket{le="1000"}[2h])) / sum(rate(turn_content_ms_count[2h]))) > 0.150)'
        for: 2m
        labels:
          severity: ticket
          slo: content_wait
        annotations:
          summary: 'A child waits for content is missing its bar (3x budget burn)'
          bar: 'Child waits for content — < 1s at the 95th percentile'
