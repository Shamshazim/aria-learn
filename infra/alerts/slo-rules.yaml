      - alert: StaticFallbackReachesAChildBudgetBurnSlow3d
        expr: '(sum(rate(fallback_used_total[3d])) / sum(rate(turns_total[3d])) > 0.0100) and (sum(rate(fallback_used_total[6h])) / sum(rate(turns_total[6h])) > 0.0100)'
        for: 2m
        labels:
          severity: ticket
          slo: static_fallback_reaches_a_child
        annotations:
          summary: 'A child gets canned text instead of teaching is missing its bar (1x budget burn)'
          bar: 'P2H-11: no static fallback reaches a child in a nominal session'
          runbook: 'infra/alerts/runbooks/static_fallback_reaches_a_child.md'
