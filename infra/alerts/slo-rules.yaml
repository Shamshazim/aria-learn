      - alert: VisibleWelcomeBudgetBurnSlow1d
        expr: '(1 - (sum(rate(arrival_ms_bucket{le="500"}[1d])) / sum(rate(arrival_ms_count[1d]))) > 0.150) and (1 - (sum(rate(arrival_ms_bucket{le="500"}[2h])) / sum(rate(arrival_ms_count[2h]))) > 0.150)'
        for: 2m
        labels:
          severity: ticket
          slo: visible_welcome
        annotations:
          summary: 'The welcome appears is missing its bar (3x budget burn)'
          bar: 'Visible personalised welcome after arrival — < 500ms at the 95th percentile'
          runbook: 'infra/alerts/runbooks/visible_welcome.md'
      - alert: VisibleWelcomeBudgetBurnSlow3d
        expr: '(1 - (sum(rate(arrival_ms_bucket{le="500"}[3d])) / sum(rate(arrival_ms_count[3d]))) > 0.0500) and (1 - (sum(rate(arrival_ms_bucket{le="500"}[6h])) / sum(rate(arrival_ms_count[6h]))) > 0.0500)'
        for: 2m
        labels:
          severity: ticket
          slo: visible_welcome
        annotations:
          summary: 'The welcome appears is missing its bar (1x budget burn)'
          bar: 'Visible personalised welcome after arrival — < 500ms at the 95th percentile'
          runbook: 'infra/alerts/runbooks/visible_welcome.md'
      - alert: StaticFallbackReachesAChildBudgetBurnSlow1d
        expr: '(sum(rate(fallback_used_total[1d])) / sum(rate(turns_total[1d])) > 0.0300) and (sum(rate(fallback_used_total[2h])) / sum(rate(turns_total[2h])) > 0.0300)'
        for: 2m
        labels:
          severity: ticket
          slo: static_fallback_reaches_a_child
        annotations:
          summary: 'A child gets canned text instead of teaching is missing its bar (3x budget burn)'
          bar: 'P2H-11: no static fallback reaches a child in a nominal session'
