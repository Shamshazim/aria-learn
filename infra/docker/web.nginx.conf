# The web app is a single-page app: every path that is not a file on disk is the app's own
# route, and must return index.html rather than a 404. `/hello`, `/grown-ups` and
# `/session/:grade/:subject` are real URLs a child or a parent can be handed.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never cached: it is how a browser learns about a new deploy at all. The hashed assets it
  # names are immutable, so they are cached hard.
  location = /index.html {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # A container-local liveness path that does not depend on the app having built correctly.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Defence in depth. The API sets its own headers (helmet); these cover the static origin,
  # which serves no HTML that should ever be framed and no content whose type should be
  # guessed at.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
}
