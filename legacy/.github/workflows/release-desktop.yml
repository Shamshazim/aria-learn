name: Release desktop app

# Publishing is deliberately manual: a release ships a 267 MB binary that installs a database
# and an AI engine on a family's computer, so it should be a decision, not a side effect of
# merging. Push a tag (v0.1.0) or run the workflow by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # required to create the release and upload installers

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per architecture, because the payload is native code: the jlink'd JRE,
          # the PostgreSQL server and the Ollama binary are all built for the host. An
          # arm64 runner cannot produce a working Intel build.
          - runner: macos-14      # Apple Silicon
            label: macOS (Apple Silicon)
            builder: --mac
          - runner: windows-latest
            label: Windows (x64)
            builder: --win
          # Intel macOS is temporarily out of the matrix. GitHub's macos-13 runners are scarce
          # enough that the job sat queued for over half an hour while the other two finished,
          # holding up the whole release. Intel Macs also run the 7B model slowly enough that
          # they are the least urgent audience. Restore by putting this back:
          #
          #   - runner: macos-13    # Intel
          #     label: macOS (Intel)
          #     builder: --mac
          #
          # Nothing else needs changing — the build is already per-architecture.

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      # jlink comes from the JDK, so a full JDK is needed here even though the shipped
      # runtime is a trimmed one.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        run: |
          cd backend && ./mvnw --batch-mode test
          cd ../desktop && npm test

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: |
          cd backend
          .\mvnw.cmd --batch-mode test
          cd ..\desktop
          npm test

      - name: Stage the bundled runtime
        working-directory: desktop
        run: npm run build:runtime

      - name: Build and publish the installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing and notarization activate only when the secrets exist, so the workflow
          # still produces an (unsigned) build for a fork or a contributor without them.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ] && [ -z "$CSC_LINK" ]; then
            echo "::warning::No signing certificate configured. This build is UNSIGNED and"
            echo "::warning::macOS will refuse to open it. Add the MAC_CERTIFICATE_P12,"
            echo "::warning::MAC_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD"
            echo "::warning::and APPLE_TEAM_ID secrets — see docs/apple-signing.md."
            npx electron-builder ${{ matrix.builder }} --publish always \
              -c.mac.identity=null -c.mac.notarize=false
          else
            npx electron-builder ${{ matrix.builder }} --publish always
          fi

      # electron-builder signs and notarizes the .app and then wraps it in a DMG, leaving the
      # disk image itself bare — and macOS assesses the disk image first, so a parent is stopped
      # before ever reaching the signed app inside. Sign, notarize and staple the DMG too, then
      # re-upload it over the one already published. The release is a draft until we choose
      # otherwise, so the unverified copy is never visible to anyone.
      - name: Notarize and staple the disk image
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x scripts/notarize-dmg.sh
          ./scripts/notarize-dmg.sh dist
          node scripts/refresh-update-manifest.mjs dist

      # Only meaningful for a tagged release, which is the only case where a release exists to
      # upload over. Re-uploading an unchanged file is harmless, so this needs no other guard.
      - name: Publish the notarized disk image over the unsigned one
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in dist/*.dmg dist/latest-mac.yml; do
            [ -f "$f" ] || continue
            echo "  • re-uploading $(basename "$f")"
            gh release upload "${GITHUB_REF_NAME}" "$f" --repo "${GITHUB_REPOSITORY}" --clobber
          done

      - name: Keep the installer even if publishing failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.runner }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          if-no-files-found: warn
          retention-days: 14
