<meta charset="utf-8">
<title>Aria Session Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════════════
   Aria Learn — student session prototype
   One agent-led screen, three age bands. Mock data only; no network.
   ══════════════════════════════════════════════════════════════════════ */

:root{
  --violet:#6366F1;
  --violet-deep:#4F46E5;
  --violet-ink:#312E81;
  --blue:#2F73F0;
  --green:#57A94A;
  --amber:#F2B233;
  --purple:#7C5CE0;
  --red:#E23B3B;

  --ground:#F1EFFC;
  --card:#FFFFFF;
  --line:#E6E2F7;
  --ink:#221E3D;
  --ink-soft:#6B6790;
  --ink-faint:#9A96B8;

  --r-lg:24px; --r-md:16px; --r-sm:10px;
  --shadow:0 8px 28px rgba(56,42,120,.10);
  --shadow-lift:0 14px 40px rgba(56,42,120,.16);

  --font-ui:'Nunito',system-ui,sans-serif;
  --font-display:'Baloo 2','Nunito',system-ui,sans-serif;
  --font-math:'Source Serif 4',Georgia,serif;
}

/* The senior band is the same system, matured: whiter ground, sharper corners,
   quieter accents. Nothing about the engine changes — only these tokens. */
body[data-band="senior"]{
  --ground:#FAFAFC;
  --line:#E7E7EE;
  --ink:#1B1B23;
  --ink-soft:#63636F;
  --ink-faint:#9B9BA6;
  --r-lg:12px; --r-md:10px; --r-sm:8px;
  --shadow:0 1px 2px rgba(20,20,40,.05);
  --shadow-lift:0 4px 16px rgba(20,20,40,.08);
  --font-ui:'Plus Jakarta Sans',system-ui,sans-serif;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--font-ui); -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:3px solid var(--violet); outline-offset:2px; border-radius:6px;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ── Prototype toolbar. Deliberately dark so nobody mistakes it for the product ── */
.proto{
  position:sticky; top:0; z-index:60; background:#17162A; color:#EDEBFF;
  display:flex; flex-wrap:wrap; align-items:center; gap:18px;
  padding:10px 18px; font-size:13px; font-weight:600;
}
.proto b{font-weight:800; letter-spacing:.04em; text-transform:uppercase; font-size:11px; color:#9C97D6}
.proto-group{display:flex; align-items:center; gap:8px}
.seg{display:flex; background:#25243D; border-radius:999px; padding:3px}
.seg button{padding:6px 14px; border-radius:999px; color:#B9B5E6; font-size:13px; font-weight:700}
.seg button[aria-pressed="true"]{background:#6366F1; color:#fff}
.proto-note{margin-left:auto; color:#77739F; font-weight:600}

/* ── App frame ───────────────────────────────────────────────────────── */
.app{min-height:calc(100vh - 44px); display:flex; flex-direction:column}

.topbar{
  display:flex; align-items:center; gap:16px; padding:14px 26px;
  background:#fff; border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; color:var(--violet-ink)}
body[data-band="senior"] .brand{font-size:17px; font-weight:700}
.brand svg{flex:none}
.topbar-mid{margin:0 auto; display:flex; align-items:center; gap:10px}
.who{display:flex; align-items:center; gap:10px; font-weight:700}
.avatar{width:38px; height:38px; border-radius:50%; background:#DED9FA; display:grid; place-items:center; font-size:20px}
body[data-band="senior"] .avatar{width:30px; height:30px; font-size:16px}
.focus-line{color:var(--ink-soft); font-weight:500; font-size:14px}
.topbar-right{display:flex; align-items:center; gap:14px; margin-left:auto; font-weight:700}
.flame{display:flex; align-items:center; gap:6px}
.chip{border:1.5px solid var(--violet); color:var(--violet-deep); border-radius:999px; padding:3px 12px; font-size:13px}
.xp{width:150px; height:9px; border-radius:999px; background:#E4E1F5; overflow:hidden}
.xp i{display:block; height:100%; background:var(--violet); border-radius:999px}
.signout{color:var(--ink); font-weight:700; padding:6px 4px}
.divider{width:1px; height:24px; background:var(--line)}

/* ── Stage ───────────────────────────────────────────────────────────── */
.stage{flex:1; display:grid; gap:26px; padding:26px; align-content:start}
body[data-band="early"] .stage{grid-template-columns:minmax(220px,1fr) minmax(0,2.1fr) 90px}
body[data-band="middle"] .stage{grid-template-columns:minmax(0,1fr) 340px; justify-items:center}
body[data-band="middle"] .col-main{width:100%; max-width:760px}
body[data-band="senior"] .stage{grid-template-columns:minmax(0,1fr) 380px; padding:22px 26px}

.col-owl{display:flex; align-items:center; justify-content:center}
.col-main{display:flex; flex-direction:column; gap:18px; min-width:0}
.col-side{min-width:0}
.col-jar{display:flex; justify-content:center; align-items:flex-start; padding-top:6px}

/* ── Cards ───────────────────────────────────────────────────────────── */
.card{background:var(--card); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:26px}
body[data-band="senior"] .card{border:1px solid var(--line); box-shadow:var(--shadow); padding:0}

/* ── Aria speech ─────────────────────────────────────────────────────── */
.say-row{display:flex; align-items:flex-start; gap:14px}
.say{
  flex:1; background:#EFECFD; border-radius:20px; padding:16px 22px;
  font-weight:700; line-height:1.35; position:relative;
}
body[data-band="early"] .say{font-family:var(--font-display); font-size:34px; text-align:center}
body[data-band="middle"] .say{font-size:19px}
.say::after{
  content:""; position:absolute; left:-9px; top:22px; width:18px; height:18px;
  background:#EFECFD; transform:rotate(45deg); border-radius:3px;
}
body[data-band="early"] .say::after{display:none}
.speak{
  flex:none; width:52px; height:52px; border-radius:50%; background:var(--violet);
  color:#fff; display:grid; place-items:center; box-shadow:var(--shadow);
}
.speak.on{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.09)}}

.owl-inline{flex:none}

/* ── Countables ──────────────────────────────────────────────────────── */
.items{display:flex; justify-content:center; align-items:center; gap:46px; flex-wrap:wrap; padding:22px 0 8px}
.groups{display:flex; justify-content:center; gap:16px; flex-wrap:wrap; padding:14px 0 4px}
.tray{
  border:2px solid #D9D5EE; border-radius:12px; padding:12px;
  display:grid; grid-template-columns:repeat(3,20px); gap:9px; justify-content:center;
}
.tray span{width:20px; height:20px; border-radius:50%; border:2px solid #C9C4E6}
.hintline{text-align:center; color:var(--ink-soft); font-weight:700; font-size:15px; margin-top:8px}

/* ── Answer: tap tiles (early) ───────────────────────────────────────── */
.tiles{display:flex; gap:22px; justify-content:center; flex-wrap:wrap}
.tile{
  width:150px; height:150px; border-radius:22px; color:#fff;
  font-family:var(--font-display); font-size:64px; font-weight:700;
  box-shadow:0 6px 0 rgba(0,0,0,.13); transition:transform .12s ease;
}
.tile:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.13)}
.tile.t0{background:var(--green)} .tile.t1{background:#4A90D9}
.tile.t2{background:var(--amber)} .tile.t3{background:var(--purple)}
.tile.chosen{outline:6px solid var(--violet-ink); outline-offset:4px}
.tile.right{background:var(--green)} .tile.wrong{background:#D6605A}
.tile.muted{background:#D8D4E8; color:#fff}
.tile[disabled]{cursor:default}

/* ── Answer: word choices (middle) ───────────────────────────────────── */
.choices{display:grid; grid-template-columns:repeat(2,1fr); gap:14px}
.choice{
  background:#fff; border:2px solid var(--line); border-radius:var(--r-md);
  padding:18px 20px; font-size:17px; font-weight:700; text-align:left;
  box-shadow:var(--shadow); transition:border-color .12s ease;
}
.choice:hover{border-color:var(--violet)}
.choice.chosen{border-color:var(--violet); background:#F4F2FE}
.choice.right{border-color:var(--green); background:#EFF8ED}
.choice.wrong{border-color:var(--red); background:#FDF0F0}

/* ── Answer: number pad (middle) ─────────────────────────────────────── */
.padwrap{display:flex; flex-direction:column; gap:12px; align-items:center}
.padvalue{
  width:100%; max-width:420px; background:#fff; border:1.5px solid var(--line);
  border-radius:var(--r-md); padding:16px; text-align:center;
  font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; min-height:66px;
}
.padvalue .ph{color:var(--ink-faint)}
.caret{display:inline-block; width:2px; height:28px; background:var(--ink); vertical-align:-5px; animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.pad{display:grid; grid-template-columns:repeat(3,132px); gap:10px}
.key{
  height:62px; background:#fff; border:1.5px solid var(--line); border-radius:var(--r-md);
  font-size:22px; font-weight:700; display:grid; place-items:center;
}
.key:hover{border-color:var(--violet); color:var(--violet-deep)}
.key.enter{background:var(--violet); color:#fff; border-color:var(--violet)}

/* ── Answer: work rows (senior) ──────────────────────────────────────── */
.pane{padding:22px 26px}
.pane + .pane{border-top:1px solid var(--line)}
.problem{font-family:var(--font-math); font-size:26px; display:flex; gap:34px; align-items:baseline}
.problem em{font-style:italic}
.pane-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.pane-head h3{margin:0; font-size:15px; font-weight:600}
.tools{display:flex; gap:8px}
.tool{width:38px; height:32px; border:1px solid var(--line); border-radius:8px; display:grid; place-items:center; color:var(--ink-soft)}
.rows{border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden}
.row{display:flex; align-items:center; border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .n{width:46px; text-align:center; color:var(--ink-faint); font-size:14px; flex:none}
.row input{
  flex:1; border:0; padding:16px 8px; font-family:var(--font-math); font-size:20px;
  background:transparent; color:var(--ink);
}
.row input::placeholder{color:var(--ink-faint); font-style:italic}
.final{margin-top:18px}
.final label{display:block; font-size:14px; font-weight:600; margin-bottom:8px}
.final input{
  width:100%; border:1px solid var(--line); border-radius:var(--r-sm); padding:14px 16px;
  font-family:var(--font-math); font-size:20px; background:#fff; color:var(--ink);
}
.actions{display:flex; align-items:center; gap:18px; margin-top:20px}

/* ── Answer: free text (senior reading) ──────────────────────────────── */
.longtext{
  width:100%; min-height:120px; border:1px solid var(--line); border-radius:var(--r-sm);
  padding:14px 16px; font:inherit; font-size:16px; line-height:1.5; resize:vertical; background:#fff; color:var(--ink);
}

/* ── Buttons ─────────────────────────────────────────────────────────── */
.btn{border-radius:999px; font-weight:800; display:inline-flex; align-items:center; gap:10px; justify-content:center}
.btn-go{background:var(--blue); color:#fff; padding:20px 64px; font-size:26px; box-shadow:0 6px 0 #1F55BD}
.btn-go:active{transform:translateY(3px); box-shadow:0 3px 0 #1F55BD}
.btn-check{background:var(--violet-deep); color:#fff; padding:14px 30px; font-size:16px}
body[data-band="senior"] .btn-check{border-radius:8px; padding:12px 22px; font-weight:600}
.btn-ghost{color:var(--violet-deep); font-weight:700; padding:12px 8px}
.btn-hint{
  background:#FDF4E3; color:#B8791A; border:1.5px solid #F2D9A8;
  padding:11px 22px; font-size:15px;
}

/* ── Feedback ────────────────────────────────────────────────────────── */
.verdict{
  display:flex; align-items:center; gap:12px; border-radius:var(--r-md);
  padding:16px 20px; font-weight:800; font-size:18px; animation:pop .28s ease;
}
body[data-band="early"] .verdict{font-family:var(--font-display); font-size:26px; justify-content:center}
.verdict.ok{background:#EAF7E7; color:#2F6B24}
.verdict.no{background:#FCF0EE; color:#A93A2C}
@keyframes pop{from{transform:scale(.94); opacity:0}}

/* ── Progress + reward ───────────────────────────────────────────────── */
.dots{display:flex; gap:14px; justify-content:center}
.dot{width:18px; height:18px; border-radius:50%; border:2.5px solid var(--violet); background:#fff}
.dot.done{background:var(--violet)}
.bar{display:flex; align-items:center; gap:14px; color:var(--ink-soft); font-size:13px}
.bar .segs{display:flex; gap:6px}
.bar i{width:56px; height:6px; border-radius:3px; background:#E5E5EC}
.bar i.done{background:var(--violet-deep)}

.jar{position:relative; width:76px; height:104px}
.jar-count{
  position:absolute; inset:auto 0 -26px 0; text-align:center;
  font-weight:800; color:var(--violet-deep); font-size:15px;
}

/* ── Bottom bar (early + middle) ─────────────────────────────────────── */
.bottom{display:flex; align-items:center; gap:16px; justify-content:center; padding-top:6px}
.mic{width:64px; height:64px; border-radius:50%; background:var(--violet); color:#fff; display:grid; place-items:center; box-shadow:var(--shadow)}
body[data-band="middle"] .mic{width:52px; height:52px}
.ask-pill{
  background:#fff; border:1.5px solid var(--line); border-radius:999px;
  padding:14px 24px; font-weight:800; color:var(--violet-deep);
  display:inline-flex; align-items:center; gap:10px; box-shadow:var(--shadow);
}

/* ── Ask Aria panel ──────────────────────────────────────────────────── */
.chat{
  background:#fff; border-radius:var(--r-lg); box-shadow:var(--shadow);
  display:flex; flex-direction:column; height:100%; min-height:420px; overflow:hidden;
}
body[data-band="senior"] .chat{border:1px solid var(--line)}
.chat-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; font-weight:800}
body[data-band="senior"] .chat-head{border-bottom:1px solid var(--line); font-weight:600}
.chat-body{flex:1; overflow-y:auto; padding:6px 20px 16px; display:flex; flex-direction:column; gap:14px}
.turn{display:flex; gap:10px; align-items:flex-start; max-width:92%}
.turn.child{align-self:flex-end; flex-direction:row-reverse}
.bub{background:#EFECFD; border-radius:16px; padding:12px 16px; font-size:15px; line-height:1.4}
.turn.child .bub{background:#E4E9FB}
.stamp{font-size:11px; color:var(--ink-faint); margin-top:6px}
.chat-input{display:flex; align-items:center; gap:10px; padding:14px 16px; border-top:1px solid var(--line)}
.chat-input input{flex:1; border:1.5px solid var(--line); border-radius:999px; padding:12px 18px; font:inherit; background:#fff; color:var(--ink)}
body[data-band="senior"] .chat-input input{border-radius:8px}
.iconbtn{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:var(--violet-deep)}

/* Early band opens the chat as a full overlay: a docked panel is one more thing
   on screen for a child who cannot read the rest of it yet. */
.overlay{position:fixed; inset:0; background:rgba(30,26,60,.5); display:grid; place-items:center; z-index:50; padding:24px}
.overlay .chat{width:min(560px,100%); height:min(620px,86vh)}

/* ── Session complete ────────────────────────────────────────────────── */
.done-card{text-align:center; display:flex; flex-direction:column; align-items:center; gap:16px; padding:44px 26px}
.done-card h2{margin:0; font-family:var(--font-display); font-size:38px}
body[data-band="senior"] .done-card h2{font-family:var(--font-ui); font-size:26px; font-weight:600}
.done-card p{margin:0; color:var(--ink-soft); font-size:17px; max-width:46ch; line-height:1.5}

/* ── The owl ─────────────────────────────────────────────────────────── */
.aria{overflow:visible}
.aria .body{animation:bob 3.4s ease-in-out infinite; transform-origin:100px 170px}
@keyframes bob{50%{transform:translateY(-7px)}}
.aria .lid{transform-origin:center; transform:scaleY(0); animation:blinkeye 5s infinite}
@keyframes blinkeye{0%,94%,100%{transform:scaleY(0)} 96%,98%{transform:scaleY(1)}}
.aria.speaking .beak{animation:talk .28s ease-in-out infinite alternate; transform-origin:100px 108px}
@keyframes talk{to{transform:scaleY(1.5)}}
.aria.cheer .wing-l{animation:flapl .4s ease-in-out infinite alternate; transform-origin:56px 110px}
.aria.cheer .wing-r{animation:flapr .4s ease-in-out infinite alternate; transform-origin:144px 110px}
@keyframes flapl{to{transform:rotate(-24deg)}}
@keyframes flapr{to{transform:rotate(24deg)}}
.aria.think .brow{opacity:1}
.aria .brow{opacity:0; transition:opacity .2s}

/* ── Responsive ──────────────────────────────────────────────────────── */
@media (max-width:1080px){
  body[data-band="early"] .stage{grid-template-columns:1fr; }
  body[data-band="early"] .col-owl{order:-1}
  body[data-band="early"] .col-jar{position:fixed; right:14px; top:120px}
  body[data-band="middle"] .stage,
  body[data-band="senior"] .stage{grid-template-columns:1fr}
  .col-side{display:none}
  .pad{grid-template-columns:repeat(3,100px)}
}
@media (max-width:560px){
  .tile{width:120px; height:120px; font-size:52px}
  .items{gap:24px}
  .topbar{padding:12px 14px; gap:10px}
  .xp,.focus-line{display:none}
  .stage{padding:16px}
}
</style>

<div class="proto">
  <b>Prototype</b>
  <div class="proto-group">
    <b>Band</b>
    <div class="seg" id="segBand">
      <button data-v="early">TK–2</button>
      <button data-v="middle">Grades 3–5</button>
      <button data-v="senior">Grades 6–8</button>
    </div>
  </div>
  <div class="proto-group">
    <b>Subject</b>
    <div class="seg" id="segSubject">
      <button data-v="math">Math</button>
      <button data-v="reading">Reading</button>
      <button data-v="science">Science</button>
    </div>
  </div>
  <button class="btn btn-ghost" id="restart" style="color:#B9B5E6">Restart session</button>
  <span class="proto-note">Mock data. Nothing is saved.</span>
</div>

<div class="app" id="app"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   Content. Three bands × three subjects. Everything here is mock data —
   the real app receives one step at a time from the server planner.
   ══════════════════════════════════════════════════════════════════════ */

const CONTENT = {
  early: {
    math: { focus: 'Counting to 5', steps: [
      { say:'How many apples?', visual:{kind:'items', item:'apple', count:3},
        answer:'tiles', choices:['2','3','4','5'], key:'3',
        hint:'Touch each apple. Say one number for each one.',
        teach:'One… two… three. There are three apples.' },
      { say:'Now count the stars.', visual:{kind:'items', item:'star', count:5},
        answer:'tiles', choices:['3','4','5','6'], key:'5',
        hint:'Point at each star while you count.',
        teach:'Five stars. Count them with your finger.' },
      { say:'How many blocks?', visual:{kind:'items', item:'block', count:2},
        answer:'tiles', choices:['1','2','3','4'], key:'2',
        hint:'There are not many. Look again.', teach:'Two blocks. Just two.' },
    ]},
    reading: { focus: 'First sounds', steps: [
      { say:'Which letter says buh, like ball?', answer:'tiles', choices:['B','D','M','S'], key:'B',
        hint:'Buh… buh… ball. Say it out loud.', teach:'B says buh. Ball starts with B.' },
      { say:'Which letter says sss, like sun?', answer:'tiles', choices:['S','T','P','N'], key:'S',
        hint:'Make the sound of a snake.', teach:'S says sss. Sun starts with S.' },
      { say:'Which letter says mmm, like moon?', answer:'tiles', choices:['N','M','W','R'], key:'M',
        hint:'Close your lips and hum.', teach:'M says mmm. Moon starts with M.' },
    ]},
    science: { focus: 'Living and not living', steps: [
      { say:'Which one is alive?', answer:'tiles', choices:['🐶','🪨','🚗','🥄'], key:'🐶',
        hint:'Which one eats and grows?', teach:'A dog is alive. It eats, grows and moves on its own.' },
      { say:'Which one grows in the ground?', answer:'tiles', choices:['🌻','🔨','📕','🧦'], key:'🌻',
        hint:'Look for the one with roots.', teach:'A flower grows in the ground.' },
      { say:'Which one do we drink?', answer:'tiles', choices:['💧','🧱','🪵','🔑'], key:'💧',
        hint:'Your body needs it every day.', teach:'We drink water.' },
    ]},
  },

  middle: {
    math: { focus: 'Multiplication as equal groups', steps: [
      { say:'A baker has 4 trays. Each tray holds 6 muffins. How many muffins in total?',
        prompt:'4 trays · 6 muffins on each tray', visual:{kind:'groups', groups:4, per:6},
        answer:'numpad', key:'24',
        hint:'Count one tray first, then add that number four times.',
        teach:'Four groups of six. 6 + 6 + 6 + 6 = 24, which is the same as 4 × 6.' },
      { say:'Now try 3 shelves with 7 books on each. How many books?',
        prompt:'3 shelves · 7 books on each shelf', visual:{kind:'groups', groups:3, per:7},
        answer:'numpad', key:'21',
        hint:'Seven, three times. You can add or you can multiply.',
        teach:'3 × 7 = 21 books.' },
      { say:'A box holds 8 crayons. You have 5 boxes. How many crayons?',
        prompt:'5 boxes · 8 crayons in each box', visual:{kind:'groups', groups:5, per:8},

/* ── Narration. The early band cannot read the instruction, so speech is not a
      convenience there — it is how the task is delivered. ─────────────────── */
function speak(text){
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = isEarly() ? 0.9 : 1;
  u.pitch = 1.15;
  u.onstart = () => { S.speaking = true; paintOwl(); };
  u.onend = u.onerror = () => { S.speaking = false; paintOwl(); };
  window.speechSynthesis.speak(u);
}
function paintOwl(){
  document.querySelectorAll('.aria').forEach((el) => {
    el.classList.toggle('speaking', S.speaking);
    el.classList.remove('cheer','think');
    if (S.mood !== 'idle') el.classList.add(S.mood);
  });
}

  const mid = isEarly()
    ? `<div class="who"><span class="avatar">${w.face}</span> ${w.name}</div>`
    : S.band === 'senior'
      ? `<div class="focus-line">Today's focus: ${esc(focus())}</div>`
      : `<div class="who"><span class="avatar">${w.face}</span> ${w.name}</div>`;
  const right = S.band === 'early'
    ? `<span class="flame">${IC.flame} ${w.streak}</span>
       <span class="divider"></span><button class="signout">Sign out</button>`
    : S.band === 'middle'
      ? `<span class="flame">${IC.flame} ${w.streak}</span>
         <span class="chip">Level 6</span>
         <span class="xp"><i style="width:60%"></i></span>
         <span class="divider"></span><button class="signout">Sign out</button>`
      : `<span class="flame">${IC.flame} ${w.streak}</span>
         <span class="xp"><i style="width:60%"></i></span>
         <div class="who"><span class="avatar">${w.face}</span> ${w.name}</div>
         <span class="divider"></span><button class="signout">Sign out</button>`;

}

    const art = { apple:appleSVG, star:starSVG, block:blockSVG }[v.item];
    return `<div class="items">${Array.from({length:v.count}, () => art(isEarly()?118:62)).join('')}</div>`;
  }
  return `<div class="groups">${Array.from({length:v.groups}, () =>
    `<div class="tray">${'<span></span>'.repeat(v.per)}</div>`).join('')}</div>`;
}

  <path d="M50 8 62 38 95 40 69 60 78 92 50 74 22 92 31 60 5 40 38 38Z" fill="#F5B833"/></svg>`;

function dotsHTML(){
  const n = steps().length;
  return `<div class="dots">${Array.from({length:n}, (_, k) =>
    `<span class="dot ${k < S.i || (k === S.i && S.verdict && S.verdict.ok) ? 'done' : ''}"></span>`).join('')}</div>`;
}
function barHTML(){
  const n = steps().length, done = S.i + (S.verdict && S.verdict.ok ? 1 : 0);
  return `<div class="bar"><div class="segs">${Array.from({length:n}, (_, k) =>
    `<i class="${k < done ? 'done' : ''}"></i>`).join('')}</div>
    <span>${done} of ${n} in this session</span></div>`;
}

function controlHTML(){
  const st = step(), locked = !!(S.verdict && S.verdict.ok);
  switch (st.answer){
    case 'tiles':
      return `<div class="tiles">${st.choices.map((c, k) => {
        let cls = `tile t${k % 4}`;
        if (S.chosen === c) cls += ' chosen';
        if (S.verdict) cls += S.chosen === c ? (S.verdict.ok ? ' right' : ' wrong') : ' muted';
        return `<button class="${cls}" data-pick="${esc(c)}" ${locked ? 'disabled' : ''}>${esc(c)}</button>`;
      }).join('')}</div>`;

    case 'choices':
      return `<div class="choices">${st.choices.map((c) => {
        let cls = 'choice';
        if (S.chosen === c) cls += ' chosen';
        if (S.verdict && S.chosen === c) cls += S.verdict.ok ? ' right' : ' wrong';
        return `<button class="${cls}" data-pick="${esc(c)}" ${locked ? 'disabled' : ''}>${esc(c)}</button>`;
      }).join('')}</div>`;

    case 'numpad':
      return `<div class="padwrap">
        <div class="padvalue" id="padvalue">${S.value ? esc(S.value) : '<span class="ph">—</span>'}<span class="caret"></span></div>
        <div class="pad">
          ${['1','2','3','4','5','6','7','8','9'].map((k) => `<button class="key" data-key="${k}">${k}</button>`).join('')}
          <button class="key" data-key="del" aria-label="Delete">${IC.del}</button>
          <button class="key" data-key="0">0</button>
          <button class="key enter" data-key="go" aria-label="Check">${IC.enter}</button>
        </div></div>`;

    case 'work': {
      const rows = [...(st.prefill || []), ...S.workRows, ''];
      return `<div class="pane">
        <div class="pane-head"><h3>Your work</h3>
          <div class="tools"><span class="tool">${IC.keyboard}</span><span class="tool">π</span><span class="tool">${IC.pencil}</span></div>
        </div>
        <div class="rows">${rows.map((r, k) => `<div class="row"><span class="n">${k+1}</span>
          <input data-row="${k}" value="${esc(r)}" placeholder="${k === rows.length-1 ? 'next step…' : ''}"></div>`).join('')}</div>
        <div class="final"><label for="final">Final answer</label>
          <input id="final" value="${esc(S.finalValue)}" placeholder="x = ?"></div>
        <div class="actions">
          <button class="btn btn-check" data-act="check">Check my work</button>
          <button class="btn btn-ghost" data-act="hint">I'm stuck</button>
        </div></div>`;
    }

    default: // free text
      return `<div class="pane">
        <div class="pane-head"><h3>Your answer</h3></div>
        <textarea class="longtext" id="longtext" placeholder="Write what you think…">${esc(S.textValue)}</textarea>
        <div class="actions">
          <button class="btn btn-check" data-act="check">Send to Aria</button>
          <button class="btn btn-ghost" data-act="hint">I'm stuck</button>
        </div></div>`;
  }
}

function verdictHTML(){
  if (!S.verdict) return '';
  const v = S.verdict;
  return `<div class="verdict ${v.ok ? 'ok' : 'no'}">
    <span>${v.ok ? '✓' : '✕'}</span><span>${esc(v.text)}</span></div>
    ${v.reveal ? `<div class="hintline">${esc(v.reveal)}</div>` : ''}`;
}

function chatHTML(){
  const body = S.chat.map((t) => `<div class="turn ${t.from}">
      ${t.from === 'aria' ? owlSVG(32, true) : `<span class="avatar" style="width:32px;height:32px;font-size:17px">${WHO[S.band].face}</span>`}
      <div><div class="bub">${esc(t.text)}</div>${S.band === 'senior' ? `<div class="stamp">${t.at}</div>` : ''}</div>
    </div>`).join('');
  return `<div class="chat">
    <div class="chat-head"><span>${S.band === 'senior' ? 'Aria' : 'Ask Aria'}</span>
      ${isEarly() ? '<button class="iconbtn" data-act="closechat" aria-label="Close">✕</button>' : ''}</div>
    <div class="chat-body" id="chatbody">${body}</div>
    <div class="chat-input">
      <input id="chatinput" placeholder="${S.band === 'senior' ? 'Ask Aria anything' : 'Ask me anything'}">
      <button class="iconbtn" data-act="mic" aria-label="Speak">${IC.mic}</button>
      <button class="iconbtn" data-act="send" aria-label="Send">${IC.send}</button>
    </div></div>`;
}

function doneHTML(){
  const n = steps().length;
  return `<div class="card done-card">
    ${owlSVG(isEarly() ? 190 : 120, false)}
    <h2>${isEarly() ? 'All done! 🎉' : 'Session complete'}</h2>
    <p>${isEarly()
      ? `You got ${S.stars} of ${n} right. Come back tomorrow and we will count some more.`
      : `You worked through ${n} problems on ${esc(focus().toLowerCase())} and got ${S.stars} right. Next time I will bring something a little harder.`}</p>
    <button class="btn btn-check" data-act="restart">Start again</button>
  </div>`;
}

function stageHTML(){
  if (S.done) return `<div class="stage" style="grid-template-columns:1fr">${doneHTML()}</div>`;
  const st = step();
  const answered = !!S.verdict;
  const canAdvance = answered && (S.verdict.ok || S.misses >= 2);

  const bubble = `<div class="say-row">
      ${S.band === 'senior' ? owlSVG(40, true) : (S.band === 'middle' ? `<span class="owl-inline">${owlSVG(78, false)}</span>` : '')}
      <div class="say">${esc(st.say)}</div>
      <button class="speak ${S.speaking ? 'on' : ''}" data-act="speak" aria-label="Read this out loud">${IC.speaker}</button>
    </div>`;

  const hintBtn = (!answered || !S.verdict.ok) && st.hint
    ? `<div style="display:flex;justify-content:center"><button class="btn btn-hint" data-act="hint">${IC.bulb} Need a hint?</button></div>` : '';

  const hintText = S.hintShown ? `<div class="hintline">${IC.bulb} ${esc(st.hint)}</div>` : '';

  if (isEarly()){
    return `<div class="stage">
      <div class="col-owl">${owlSVG(300, false)}</div>
      <div class="col-main">
        <div class="card">${bubble}${visualHTML(st.visual)}${hintText}</div>
        ${dotsHTML()}
        ${controlHTML()}
        ${verdictHTML()}
        <div class="bottom">
          <button class="mic" data-act="mic" aria-label="Say your answer">${IC.mic}</button>
          <button class="btn btn-go" data-act="next" ${canAdvance ? '' : 'disabled style="opacity:.45"'}>Go ${IC.arrow}</button>
          <button class="ask-pill" data-act="openchat">${IC.chat} Ask Aria</button>
        </div>
      </div>
      <div class="col-jar"><div class="jar">${jarSVG(S.stars)}<div class="jar-count">${S.stars}</div></div></div>
    </div>
    ${S.chatOpen ? `<div class="overlay" data-act="closechat-bg">${chatHTML()}</div>` : ''}`;
  }

  if (S.band === 'middle'){
    return `<div class="stage">
      <div class="col-main">
        <div class="card">${bubble}${visualHTML(st.visual)}${hintText}</div>
        ${controlHTML()}
        ${dotsHTML()}
        ${hintBtn}
        ${verdictHTML()}
        <div class="bottom">
          ${canAdvance
            ? `<button class="btn btn-go" style="padding:14px 44px;font-size:20px" data-act="next">Next ${IC.arrow}</button>`
            : `<button class="btn btn-go" style="padding:14px 44px;font-size:20px" data-act="check">Check ${IC.arrow}</button>`}
          <button class="ask-pill" data-act="openchat">${IC.chat} Ask Aria</button>
        </div>
      </div>
      <div class="col-side">${chatHTML()}</div>
    </div>`;
  }

  // Senior: the problem and the work sit in one bordered card, the conversation beside it.
  return `<div class="stage">
    <div class="col-main">
      <div class="card">
        <div class="pane"><div class="problem"><span>${esc(st.prompt || '')}</span></div></div>
        <div class="pane" style="padding-top:0;border-top:0">${bubble}</div>
        ${controlHTML()}
        ${(S.verdict || S.hintShown) ? `<div class="pane">${verdictHTML()}${hintText}
          ${canAdvance ? `<button class="btn btn-check" data-act="next" style="margin-top:12px">Next problem</button>` : ''}
        </div>` : ''}
        <div class="pane">${barHTML()}</div>
      </div>
    </div>
    <div class="col-side">${chatHTML()}</div>
  </div>`;
}

function render(){
  document.body.dataset.band = S.band;
  document.getElementById('app').innerHTML = topbar() + stageHTML();
  document.querySelectorAll('#segBand button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === S.band));
  document.querySelectorAll('#segSubject button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === S.subject));
  const cb = document.getElementById('chatbody');
  if (cb) cb.scrollTop = cb.scrollHeight;
  paintOwl();
}

/* ══════════════════════════════════════════════════════════════════════
   Behaviour
   ══════════════════════════════════════════════════════════════════════ */

function currentResponse(){
  const st = step();
  if (st.answer === 'tiles' || st.answer === 'choices') return S.chosen ?? '';
  if (st.answer === 'numpad') return S.value;
  if (st.answer === 'work') return S.finalValue.replace(/^\s*x\s*=\s*/i, '').trim();
  return S.textValue;
}

function check(){
  const st = step();
  const given = currentResponse();
  if (!given.trim()) return;

  // A free-text answer has no key. Aria takes the attempt seriously and teaches into it,
  // because marking an interpretation right or wrong is exactly what stops a child writing.
  const open = st.key === null;
  const ok = open ? given.trim().length >= 12 : given.trim().toLowerCase() === String(st.key).toLowerCase();

  S.misses = ok ? S.misses : S.misses + 1;
  if (!ok) S.hintShown = true;
  if (ok) S.stars += 1;
  S.mood = ok ? 'cheer' : 'think';

  const text = open
    ? 'Good — you committed to a reading. Here is the part worth noticing.'
    : ok ? pick(isEarly() ? PRAISE_EARLY : PRAISE) : pick(isEarly() ? MISS_EARLY : MISS);

  S.verdict = { ok: ok || open, text, reveal: (open || (!ok && S.misses >= 2)) ? st.teach : null };
  render();
  speak(text + (S.verdict.reveal ? '. ' + S.verdict.reveal : ''));
  setTimeout(() => { S.mood = 'idle'; paintOwl(); }, 2200);
}

function next(){
  if (S.i >= steps().length - 1){ S.done = true; render(); return; }
  S.i += 1;
  Object.assign(S, { value:'', chosen:null, textValue:'', finalValue:'', workRows:[], verdict:null, misses:0, hintShown:false });
  render();
  if (S.interacted) speak(step().say);
}

function restart(){
  Object.assign(S, { i:0, value:'', chosen:null, textValue:'', finalValue:'', workRows:[],
    verdict:null, misses:0, stars:0, hintShown:false, done:false, chatOpen:false,
    chat:[{ from:'aria', text:'I am right here. Ask me anything, any time.', at:clock() }] });
  render();
}

/* Aria's replies are canned, but they follow the step, so the conversation reads as if she
   knows what is on screen — which is exactly what the real endpoint must deliver. */
function ariaReply(text){
  const t = text.toLowerCase(), st = step();
  if (/hint|help|stuck|dont know|don't know|idk/.test(t)) return st.hint;
  if (/^why|how come|explain/.test(t)) return st.teach;
  if (/answer|tell me/.test(t)) return 'I will not hand it over — but I will walk you to it. ' + st.hint;
  if (/hi|hello|hey/.test(t)) return `Hello. We are on ${focus().toLowerCase()} today.`;
  return 'Good question. Try the first part on your own and tell me what you get.';
}

function send(){
  const el = document.getElementById('chatinput');
  if (!el || !el.value.trim()) return;
  const said = el.value.trim();
  S.chat.push({ from:'child', text:said, at:clock() });
  render();
  setTimeout(() => {
    const reply = ariaReply(said);
    S.chat.push({ from:'aria', text:reply, at:clock() });
    render();
    speak(reply);
  }, 550);
}

/* ── One delegated handler for the whole app ─────────────────────────── */
document.addEventListener('click', (e) => {
  S.interacted = true;
  const t = e.target.closest('[data-act],[data-pick],[data-key]');

  if (e.target.classList && e.target.classList.contains('overlay')){ S.chatOpen = false; return render(); }
  if (!t) return;

  if (t.dataset.pick !== undefined){
    if (S.verdict && S.verdict.ok) return;
    S.chosen = t.dataset.pick;
    return check();               // a tap IS the answer for these controls
  }

  if (t.dataset.key !== undefined){
    const k = t.dataset.key;
    if (k === 'del') S.value = S.value.slice(0, -1);
    else if (k === 'go') return check();
    else if (S.value.length < 6) S.value += k;
    const pv = document.getElementById('padvalue');
    if (pv) pv.innerHTML = (S.value ? esc(S.value) : '<span class="ph">—</span>') + '<span class="caret"></span>';
    return;
  }

  switch (t.dataset.act){
    case 'speak': return speak(step().say);
    case 'check': return check();
    case 'next': return next();
    case 'hint': S.hintShown = true; render(); return speak(step().hint);
    case 'openchat': S.chatOpen = true; return render();
    case 'closechat': S.chatOpen = false; return render();
    case 'send': return send();
    case 'mic': return alert('Voice answers are part of the real build. This prototype does not listen yet.');
    case 'restart': return restart();
  }
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'longtext') S.textValue = el.value;
  else if (el.id === 'final') S.finalValue = el.value;
  else if (el.dataset && el.dataset.row !== undefined){
    const base = (step().prefill || []).length;
    const k = Number(el.dataset.row) - base;
    if (k >= 0){ while (S.workRows.length <= k) S.workRows.push(''); S.workRows[k] = el.value; }
  }
});

document.addEventListener('keydown', (e) => {
  if (e.target.id === 'chatinput' && e.key === 'Enter') send();
  if (e.target.id === 'final' && e.key === 'Enter') check();
});

document.getElementById('segBand').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  S.band = b.dataset.v; restart();
});
document.getElementById('segSubject').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  S.subject = b.dataset.v; restart();
});
document.getElementById('restart').addEventListener('click', restart);

restart();
</script>
