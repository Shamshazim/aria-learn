app:
  ai:
    # Speed first: a child's turn waits on every one of these calls, and Groq answers a
    # planning or grading prompt in well under a second where the frontier endpoints take
    # one to three. The frontier endpoint stays as the fallback when Groq is down.
    routing:
      TEACH: { endpoint: groq-compatible, fallback: anthropic-sonnet }
      FAST: { endpoint: groq-fast, fallback: groq-compatible }

    endpoints:
      anthropic-sonnet:
        # Retention: standard API inputs/outputs are deleted within 30 days. ZDR is a
        # separately approved enterprise agreement; production use with learner context
        # requires that agreement on this API organization.
        api: anthropic
        base-url: https://api.anthropic.com
        api-key: ${ANTHROPIC_API_KEY}
        model: claude-sonnet-5
        supports-temperature: false
        max-tokens: 2048
        timeout-seconds: 60
        cost-per-mtok-in: 2
        cost-per-mtok-out: 10

      openai-gpt:
        # Retention: Chat Completions is ZDR-eligible, but ZDR requires OpenAI approval and
        # must be enabled for this project. Without it, abuse-monitoring content may remain
        # for up to 30 days. Production use with learner context requires ZDR enabled.
        api: openai
        base-url: https://api.openai.com/v1
        api-key: ${OPENAI_API_KEY}
        model: gpt-5.6-terra
        max-tokens: 2048
        timeout-seconds: 60
        cost-per-mtok-in: 1.25
        cost-per-mtok-out: 7.5
        reasoning: true

      groq-compatible:
        # Retention: inference content is not retained by default except temporary
        # reliability/abuse logs (up to 30 days). Enable ZDR in Groq Data Controls before
        # production use with learner context so those content logs are disabled.
        api: openai
        base-url: https://api.groq.com/openai/v1
        api-key: ${GROQ_API_KEY}
        model: openai/gpt-oss-120b
        max-tokens: 2048
        timeout-seconds: 20
        cost-per-mtok-in: 0.15
        cost-per-mtok-out: 0.6
        # Groq's response_format fails a generation outright (json_validate_failed, empty
        # output) on these models; asked by prompt they return the object every time.
        json-via: prompt
        # gpt-oss reasons before it answers, and the reasoning is billed against max_tokens:
        # without these a 120-token planning call was all thought and no answer.
        reasoning-effort: low
        reasoning-tokens: 256

      groq-fast:
        # The FAST tier: intent and grading. Same retention terms as groq-compatible.
        api: openai
        base-url: https://api.groq.com/openai/v1
        api-key: ${GROQ_API_KEY}
        model: openai/gpt-oss-20b
        max-tokens: 1024
        timeout-seconds: 20
        cost-per-mtok-in: 0.075
        cost-per-mtok-out: 0.3
        json-via: prompt
        reasoning-effort: low
        reasoning-tokens: 256
