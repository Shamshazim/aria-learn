app:
  ai:
    # Start with the simplest quality-first setup. P0-22's golden set decides when FAST
    # can move to a cheaper endpoint without weakening the tutor.
    routing:
      TEACH: { endpoint: anthropic-sonnet }
      FAST: { endpoint: anthropic-sonnet }

    endpoints:
      anthropic-sonnet:
        # Retention: standard API inputs/outputs are deleted within 30 days. ZDR is a
        # separately approved enterprise agreement; production use with learner context
        # requires that agreement on this API organization.
        api: anthropic
        base-url: https://api.anthropic.com
        api-key: ${ANTHROPIC_API_KEY}
        model: claude-sonnet-5
        max-tokens: 2048
        timeout-seconds: 60
        cost-per-mtok-in: 2
        cost-per-mtok-out: 10

      openai-gpt:
        # Retention: Chat Completions is ZDR-eligible, but ZDR requires OpenAI approval and
        # must be enabled for this project. Without it, abuse-monitoring content may remain
        # for up to 30 days. Production use with learner context requires ZDR enabled.
        api: openai
        base-url: https://api.openai.com/v1
        api-key: ${OPENAI_API_KEY}
        model: gpt-5.6-terra
        max-tokens: 2048
        timeout-seconds: 60
        cost-per-mtok-in: 1.25
        cost-per-mtok-out: 7.5
        reasoning: true

      groq-compatible:
        # Retention: inference content is not retained by default except temporary
        # reliability/abuse logs (up to 30 days). Enable ZDR in Groq Data Controls before
        # production use with learner context so those content logs are disabled.
        api: openai
        base-url: https://api.groq.com/openai/v1
        api-key: ${GROQ_API_KEY}
        model: openai/gpt-oss-120b
        max-tokens: 2048
        timeout-seconds: 20
        cost-per-mtok-in: 0.15
        cost-per-mtok-out: 0.6
